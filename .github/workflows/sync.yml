name: Atualizar TikTok Feed

on:
  workflow_dispatch:
  schedule:
    # 09:00 em Brasília (UTC-3). O script só coleta quando já se passaram 48h.
    - cron: '0 12 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tiktok-feed-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Coletar posts
        run: npm run fetch-posts -- ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
      - name: Salvar dados atualizados no repositório
        run: |
          if git diff --quiet -- data/posts.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git commit -m "chore: atualiza feed do TikTok"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
